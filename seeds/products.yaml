# Productos veterinarios Biomont para el bootstrap (spec 003).
#
# Los nombres (`name`) deben coincidir con lo cargado en `public.products`.
# Ejecutar: `DATABASE_URL=... python scripts/bootstrap_products.py`
#
# Si falla el clasificador o el usuario escribe variantes (“protego” vs
# “Proteggo”), los aliases siguen ayudando al ProductResolver (trigrams).

products:
  - name: Protego 3M
    duration_type: 3M
    description: Antiparasitario externo de ~3 meses (isoxazolinas).
    aliases:
      - protego 3 meses
      - protego 3m
      - protegg 3 meses
      - protegg 3m
      - proteggo 3 meses
      - proteggo 3m
      - protego trimestral
      - trimestral
      - el de 3 meses
      - el verde
      - el amarillo
      # Menciones coloquiales sin duración ("el protego")
      - protego
      - protegg
      - proteggo

  - name: Serentis
    duration_type: null
    description: Referencia veterinaria segun catalogo Biomont.
    aliases:
      - serenis
      - cerentis
      - serum
