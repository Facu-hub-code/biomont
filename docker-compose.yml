name: biomont

# =====================================================================
# Compose v1 - 3 servicios. La base Postgres+pgvector NO esta aca: vive
# en Railway y se accede via DATABASE_URL.
# =====================================================================

services:
  agent:
    build:
      context: .
      dockerfile: services/agent/Dockerfile
    image: biomont/agent:dev
    container_name: biomont-agent
    env_file:
      - .env
    environment:
      - SERVICE_NAME=agent
    ports:
      - "8001:8001"
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          python -c "import urllib.request,sys;
          r=urllib.request.urlopen('http://localhost:8001/health');
          sys.exit(0 if r.status == 200 else 1)"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  backoffice-api:
    build:
      context: .
      dockerfile: services/backoffice-api/Dockerfile
    image: biomont/backoffice-api:dev
    container_name: biomont-backoffice-api
    # Código montado + --reload: iterar sin rebuild cuando solo cambia Python.
    # Dependencias pesadas ([etl]) siguen viniendo de la imagen construida una vez.
    volumes:
      - ./services/common:/app/services/common:rw
      - ./services/backoffice-api:/app/services/backoffice-api:rw
      - ./.cursor:/cursor/agent-debug:rw
    # Puerto fijo 8002 en Compose (coincide con published). Evita sh -c + $$PORT, que en shell expande $$ al PID.
    command:
      - uvicorn
      - app.main:app
      - --host
      - "0.0.0.0"
      - --port
      - "8002"
      - --reload
      - --reload-dir
      - /app/services/backoffice-api/src
      - --reload-dir
      - /app/services/common/src
    env_file:
      - .env
    environment:
      - SERVICE_NAME=backoffice-api
      - AGENT_INTERNAL_BASE_URL=http://agent:8001
      # Debug NDJSON desde el código instrumentado → archivo en ./.cursor (host)
      - CURSOR_DEBUG_LOG_PATH=/cursor/agent-debug/debug-33ab56.log
    ports:
      - "8002:8002"
    depends_on:
      agent:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          python -c "import urllib.request,sys;
          r=urllib.request.urlopen('http://localhost:8002/health');
          sys.exit(0 if r.status == 200 else 1)"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  backoffice-web:
    build:
      context: services/backoffice-web
      dockerfile: Dockerfile
    image: biomont/backoffice-web:dev
    container_name: biomont-backoffice-web
    volumes:
      - ./.cursor:/cursor/agent-debug:rw
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      # SSR y server actions deben usar el nombre de servicio en la red Docker, no localhost.
      - API_INTERNAL_BASE_URL=http://backoffice-api:8002
      # Cookie de sesión sobre http://localhost:3000 (sin TLS en Compose).
      - SESSION_COOKIE_SECURE=false
    depends_on:
      backoffice-api:
        condition: service_healthy
    ports:
      - "3000:3000"
    restart: unless-stopped

networks:
  default:
    name: biomont-network
