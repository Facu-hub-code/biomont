# Golden set para evaluacion del grafo del agente (spec 003/007).
#
# Cada caso describe:
#   query:               input del usuario
#   allowed_countries:   lista ISO2 simulando un RTC autorizado
#   inherited_product_id: UUID opcional para simular conversaciones de
#                         continuacion (deja la fila de conversation_state
#                         insertada antes de correr la query).
#   expected_intent:     intent esperado del clasificador.
#   expected_product:    nombre del producto resuelto (o null).
#   expected_kind_in_filter:   `kinds` que MetaFilter debe pasar al retriever
#                              (o null si esperamos kinds=None).
#   expected_decision:   "answered" | "low_confidence" | "no_match".
#   expected_substrings: lista de substrings que la respuesta debe contener
#                        (matching case-insensitive). Solo se evalua si
#                        expected_decision == "answered".

cases:
  - id: gestacion-safety-hybrid
    query: "Puede usarse en gestacion?"
    allowed_countries: ["PE"]
    expected_intent: safety_question
    expected_product: null
    expected_kind_in_filter: ["ficha_tecnica", "bitacora", "balotario"]
    expected_decision: answered
    expected_substrings:
      - "gestante"

  - id: dose-proteggo-3m
    query: "Que dosis de Proteggo 3M le doy a un perro de 25kg?"
    allowed_countries: ["PE"]
    expected_intent: dose_calculation
    expected_product: "Proteggo 3M"
    expected_kind_in_filter: null
    expected_decision: answered
    expected_substrings:
      - "25"
      - "backoffice"

  - id: dose-marvo-formula
    query: "perro de 25 kg que tableta de MARVO 20 le doy?"
    allowed_countries: ["PE"]
    expected_intent: dose_calculation
    expected_product: "MARVO 20"
    expected_kind_in_filter: null
    expected_decision: answered
    expected_substrings:
      - "kg"

  - id: dose-tulaviot-bovine
    query: "cual es la dosis de tulaviot para una vaca de 450 kg?"
    allowed_countries: ["PE"]
    expected_intent: dose_calculation
    expected_product: "Tulaviot"
    expected_kind_in_filter: null
    expected_decision: answered
    expected_substrings:
      - "450"

  - id: comparison-oprurix-apoquel
    query: "comparar OPRURIX vs Apoquel"
    allowed_countries: ["PE"]
    expected_intent: comparison_with_competitor
    expected_product: "OPRURIX"
    expected_kind_in_filter: null
    expected_decision: answered
    expected_substrings:
      - "comparativo"

  - id: comparison-marvo-marboxi
    query: "MARVO 20 versus Marboxi diferencias"
    allowed_countries: ["PE"]
    expected_intent: comparison_with_competitor
    expected_product: "MARVO 20"
    expected_kind_in_filter: null
    expected_decision: answered
    expected_substrings:
      - "comparativo"

  - id: protocol-dapp
    query: "Cual es el protocolo para DAPP?"
    allowed_countries: ["PE"]
    expected_intent: clinical_protocol
    expected_product: null
    expected_kind_in_filter: ["bitacora", "balotario"]
    expected_decision: answered
    expected_substrings:
      - "DAPP"

  - id: imperia-indicacion-dosage
    query: "Cual es la indicacion de Imperia?"
    allowed_countries: ["PE"]
    expected_intent: dosage_question
    expected_product: "Imperia"
    expected_kind_in_filter: ["bitacora", "ficha_tecnica", "balotario"]
    expected_decision: answered
    expected_substrings:
      - "IMPERIA"

  - id: ambiguous-proteggo
    query: "Cuanto cuesta el proteggo?"
    allowed_countries: ["PE"]
    expected_intent: dosage_question
    expected_product: null
    expected_kind_in_filter: ["bitacora", "ficha_tecnica", "balotario"]
    expected_decision: low_confidence
    expected_substrings: []

  - id: out-of-scope
    query: "Cual es la capital de Francia?"
    allowed_countries: ["PE"]
    expected_intent: out_of_scope
    expected_product: null
    expected_kind_in_filter: null
    expected_decision: no_match
    expected_substrings: []
