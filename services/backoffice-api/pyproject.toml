[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "biomont-backoffice-api"
version = "0.1.0"
description = "API + ETL del backoffice de Biomont."
requires-python = ">=3.12"
dependencies = [
    "biomont-common",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "argon2-cffi>=23.1",
    "pyjwt>=2.9",
    "python-dateutil>=2.9",
    "email-validator>=2.2",
    "httpx>=0.27",
]

[project.optional-dependencies]
# docling es pesado y solo se usa en runtime para procesar PDFs. Se
# instala como extra `etl` para no inflar las imagenes de tests/CI.
etl = [
    "docling>=2.0",
    "openpyxl>=3.1",
]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "-q"
